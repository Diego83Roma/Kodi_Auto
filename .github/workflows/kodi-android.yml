
name: Build Kodi Android Engine

on:
  workflow_dispatch:
  push:
    branches:
      - Kodi-engine

jobs:
  build-kodi:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk gperf git \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

      - name: Clone Kodi source
        run: |
          git clone --depth 1 \
            https://github.com/xbmc/xbmc.git kodi

      - name: Set Kodi Auto app identity
        run: |
          sed -i 's/^APP_NAME .*/APP_NAME Kodi/' kodi/version.txt
          sed -i 's/^APP_PACKAGE .*/APP_PACKAGE it.kodiauto.media/' kodi/version.txt

          sed -i 's/@APP_NAME@/Kodi Auto/g' \
            kodi/tools/android/packaging/xbmc/strings.xml.in

          echo "Controllo identità:"
          grep -E '^(APP_NAME|APP_PACKAGE) ' kodi/version.txt
          grep 'app_name' kodi/tools/android/packaging/xbmc/strings.xml.in

          grep -q '^APP_NAME Kodi$' kodi/version.txt
          grep -q '^APP_PACKAGE it\.kodiauto\.media$' kodi/version.txt
          grep -q 'Kodi Auto' kodi/tools/android/packaging/xbmc/strings.xml.in
      - name: Apply Kodi Auto gold and black launcher icon
        working-directory: kodi/tools/android/packaging/xbmc/res/drawable
        run: |
          cat > ic_launcher_background.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="256" android:viewportHeight="256">
            <path android:pathData="M0,0h256v256h-256z" android:fillColor="#FF080B12"/>
            <path android:pathData="M0,196h256v60h-256z" android:fillColor="#FF111827"/>
          </vector>
          EOF
          cat > ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="256" android:viewportHeight="256">
            <path android:pathData="M52,91 L65,27 L103,57 L128,15 L153,57 L191,27 L204,91 Z"
                android:fillColor="#FFFFD45A" android:strokeColor="#FFB77A18"
                android:strokeWidth="5" android:strokeLineJoin="round"/>
            <path android:pathData="M69,96 Q128,73 187,96 L178,169 Q128,213 78,169 Z"
                android:fillColor="#FFE9B84C" android:strokeColor="#FF8E5A16"
                android:strokeWidth="6"/>
            <path android:pathData="M94,125 Q105,113 116,125 M140,125 Q151,113 162,125"
                android:fillColor="#00000000" android:strokeColor="#FF17130D"
                android:strokeWidth="8" android:strokeLineCap="round"/>
            <path android:pathData="M105,158 Q128,174 151,158"
                android:fillColor="#00000000" android:strokeColor="#FF17130D"
                android:strokeWidth="7" android:strokeLineCap="round"/>
            <path android:pathData="M112,184 L144,184 L224,256 L32,256 Z"
                android:fillColor="#FF252B35"/>
            <path android:pathData="M125,193 L131,193 L145,256 L111,256 Z"
                android:fillColor="#FFFFD45A"/>
          </vector>
          EOF
          echo "Icona adattiva Kodi Auto oro/nero applicata."    

      - name: Bootstrap Kodi dependencies
        working-directory: kodi/tools/depends
        run: |
          ./bootstrap

      - name: Configure Android ARM64
        working-directory: kodi/tools/depends
        run: |
          ./configure \
            --with-tarballs=$HOME/android-tools/xbmc-tarballs \
            --host=aarch64-linux-android \
            --with-sdk-path=$ANDROID_HOME \
            --prefix=$HOME/android-tools/xbmc-depends

      - name: Build Kodi dependencies
        working-directory: kodi/tools/depends
        run: |
          make -j2

      - name: Configure Kodi CMake
        working-directory: kodi
        run: |
          make -C tools/depends/target/cmakebuildsys

      - name: Build Kodi
        working-directory: kodi
        run: |
          cd build
          make -j2

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Package Kodi APK
        working-directory: kodi/build
        run: |
          make apk

      - name: Verify Kodi Auto package ID
        run: |
          APK=$(find kodi -maxdepth 1 \
            -name 'kodiapp-arm64-v8a-debug.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK non trovato"
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"

          if [ ! -f "$AAPT" ]; then
            echo "ERROR: aapt non trovato"
            exit 1
          fi

          echo "Verifica identificativo APK:"
          "$AAPT" dump badging "$APK" | head -n 1

          if ! "$AAPT" dump badging "$APK" | grep -Fq "name='it.kodiauto.media'"; then
            echo "ERROR: APK non ha il package ID previsto!"
            exit 1
          fi

          echo "OK: Kodi Auto ha un package ID separato!"

      - name: Upload Kodi APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Android-ARM64
          path: kodi/kodiapp-arm64-v8a-debug.apk
          if-no-files-found: error
