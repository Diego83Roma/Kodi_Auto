name: Build Kodi Android Engine

on:
  workflow_dispatch:
  push:
    branches:
      - Kodi-engine
      - fermata-integration
      - fermata-complete-integration
      - kodiauto-modern-ui

jobs:
  build-kodi:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk gperf git \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

      - name: Clone Kodi source
        run: |
          git clone --depth 1 \
            https://github.com/xbmc/xbmc.git kodi

      - name: Fix Kodi UUID call for current crossguid API
        working-directory: kodi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("xbmc/utils/StringUtils.cpp")
          data = source.read_text(encoding="utf-8")
          old = """  JNIEnv* env = xbmc_jnienv();
  return xg::newGuid(env).str();"""
          new = """  return xg::newGuid().str();"""
          if data.count(old) != 1:
              raise SystemExit("Chiamata UUID Android attesa non trovata una sola volta")
          source.write_text(data.replace(old, new, 1), encoding="utf-8")
          print("Compatibilità crossguid corretta: xg::newGuid() senza parametro JNIEnv.")
          PY
          grep -n -A5 -B2 'std::string StringUtils::CreateUUID' xbmc/utils/StringUtils.cpp
          ! grep -Fq 'xg::newGuid(env)' xbmc/utils/StringUtils.cpp

      - name: Apply Kodi Auto Matrix visual theme
        working-directory: kodi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          colors = Path("addons/skin.estuary/colors/defaults.xml")
          data = colors.read_text(encoding="utf-8")
          palette = {
              "primary_background": "FF073B20",
              "secondary_background": "6600FF41",
              "dialog_tint": "FF080D0A",
              "dialog_header_tint": "FF064D27",
              "button_focus": "FF00FF41",
              "border_alpha": "9900FF41",
              "button_alt_focus": "9900FF41",
              "selected": "FF00FF41",
              "blue": "FF00E83A",
              "background": "FF000000",
          }

          for name, value in palette.items():
              pattern = rf'(<color name="{re.escape(name)}">)[^<]*(</color>)'
              data, count = re.subn(
                  pattern,
                  lambda match, v=value: match.group(1) + v + match.group(2),
                  data
              )
              if count != 1:
                  raise SystemExit(f"Colore non trovato o duplicato: {name}")

          colors.write_text(data, encoding="utf-8")
          print("Tema Kodi Auto nero e verde Matrix applicato.")
          PY

          grep -q 'FF00FF41' addons/skin.estuary/colors/defaults.xml
          grep -q 'FF000000' addons/skin.estuary/colors/defaults.xml


      - name: Apply modern Matrix borders to Kodi dialogs and panels
        working-directory: kodi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          includes = Path("addons/skin.estuary/xml/Includes.xml")
          data = includes.read_text(encoding="utf-8")

          # Guard the existing Back button hook: this step must not alter it.
          back_hook = '<include condition="Skin.HasSetting(touchmode) + !Window.IsActive(home)">TouchBackButton</include>'
          if data.count(back_hook) != 1:
              raise SystemExit("Protezione: richiamo originale TouchBackButton non trovato una sola volta")

          start = data.index('<include name="DialogBackground">')
          end_marker = '\n\t</include>\n\t<include name="TopBar">'
          end = data.index(end_marker, start)
          section = data[start:end]

          anchor = '<texture colordiffuse="dialog_tint">colors/white.png</texture>\n\t\t\t</control>'
          if section.count(anchor) != 1:
              raise SystemExit("Sfondo standard dei dialoghi non trovato in modo univoco")

          # Thin neon-green perimeter, a restrained header separator and a
          # darker double-edge accent. These are decorative image controls:
          # all existing Kodi controls, IDs, labels and actions remain intact.
          frame = '''<texture colordiffuse="dialog_tint">colors/white.png</texture>
          </control>
          <control type="image">
              <left>0</left><top>0</top><right>0</right><height>2</height>
              <texture colordiffuse="button_focus">colors/white.png</texture>
          </control>
          <control type="image">
              <left>0</left><bottom>0</bottom><right>0</right><height>2</height>
              <texture colordiffuse="border_alpha">colors/white.png</texture>
          </control>
          <control type="image">
              <left>0</left><top>0</top><bottom>0</bottom><width>2</width>
              <texture colordiffuse="border_alpha">colors/white.png</texture>
          </control>
          <control type="image">
              <right>0</right><top>0</top><bottom>0</bottom><width>2</width>
              <texture colordiffuse="border_alpha">colors/white.png</texture>
          </control>
          <control type="image">
              <left>0</left><top>68</top><right>0</right><height>2</height>
              <texture colordiffuse="button_focus">colors/white.png</texture>
          </control>'''
          section = section.replace(anchor, frame, 1)
          updated = data[:start] + section + data[end:]

          if updated.count(back_hook) != 1:
              raise SystemExit("Protezione: il richiamo TouchBackButton è cambiato")
          includes.write_text(updated, encoding="utf-8")
          print("Cornice Matrix applicata ai dialoghi Estuary; controlli e navigazione originali conservati.")
          PY

          grep -q 'name="DialogBackground"' addons/skin.estuary/xml/Includes.xml
          grep -q 'colordiffuse="button_focus">colors/white.png' addons/skin.estuary/xml/Includes.xml
          grep -q '<include condition="Skin.HasSetting(touchmode) + !Window.IsActive(home)">TouchBackButton</include>' addons/skin.estuary/xml/Includes.xml
          echo "Verifica superata: cornici verdi presenti e pulsante Indietro invariato."

      - name: Set Kodi Auto app identity
        run: |
          sed -i 's/^APP_NAME .*/APP_NAME Kodi/' kodi/version.txt
          sed -i 's/^APP_PACKAGE .*/APP_PACKAGE it.kodiauto.media/' kodi/version.txt

          sed -i 's/@APP_NAME@/Kodi Auto/g' \
            kodi/tools/android/packaging/xbmc/strings.xml.in

          echo "Controllo identità:"
          grep -E '^(APP_NAME|APP_PACKAGE) ' kodi/version.txt
          grep 'app_name' kodi/tools/android/packaging/xbmc/strings.xml.in

          grep -q '^APP_NAME Kodi$' kodi/version.txt
          grep -q '^APP_PACKAGE it\.kodiauto\.media$' kodi/version.txt
          grep -q 'Kodi Auto' kodi/tools/android/packaging/xbmc/strings.xml.in

      - name: Add Android Auto declarations to Kodi manifest template
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in")
          xml = manifest.read_text(encoding="utf-8")

          # Permissions and declarations are written to Kodi's SOURCE template
          # before Kodi generates the packaged AndroidManifest.xml.
          permissions = [
              "android.permission.INTERNET",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "androidx.car.app.ACCESS_SURFACE",
              "androidx.car.app.NAVIGATION_TEMPLATES",
              "android.permission.WAKE_LOCK",
              "android.permission.DISABLE_KEYGUARD",
          ]
          for permission in permissions:
              if f'android:name="{permission}"' not in xml:
                  xml, count = re.subn(
                      r'(<manifest\b[^>]*>)',
                      r'\1\n    <uses-permission android:name="' + permission + '" />',
                      xml,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit(f"Impossibile aggiungere permesso {permission}")

          if 'com.google.android.gms.car.application' not in xml:
              xml, count = re.subn(
                  r'(<application\b[^>]*>)',
                  r'\1\n        <meta-data android:name="com.google.android.gms.car.application" android:resource="@xml/automotive_app_desc" />',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Impossibile inserire metadata Android Auto nel template")

          services = [
              """
              <service
                  android:name=".KodiAutoMediaLibraryService"
                  android:label="Kodi Auto"
                  android:exported="true"
                  android:foregroundServiceType="mediaPlayback">
                  <intent-filter>
                      <action android:name="androidx.media3.session.MediaLibraryService" />
                      <action android:name="androidx.media3.session.MediaSessionService" />
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
              """,
              """
              <service
                  android:name=".KodiAutoCarService"
                  android:exported="true"
                  android:label="Kodi Auto">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION" />
                      <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM" />
                  </intent-filter>
              </service>
              """,
          ]
          for service in services:
              match = re.search(r'android:name="([^"]+)"', service)
              component = match.group(1)
              if f'android:name="{component}"' not in xml:
                  if xml.count("</application>") != 1:
                      raise SystemExit("Chiusura application assente o non univoca nel template Kodi")
                  xml = xml.replace("</application>", service + "\n</application>", 1)

          manifest.write_text(xml, encoding="utf-8")

          required = [
              'com.google.android.gms.car.application',
              'android:name=".KodiAutoMediaLibraryService"',
              'android:name=".KodiAutoCarService"',
              'androidx.media3.session.MediaLibraryService',
              'com.google.android.gms.car.category.CATEGORY_PROJECTION',
          ]
          for value in required:
              if value not in xml:
                  raise SystemExit(f"Template manifest incompleto: {value}")
          print("Template Kodi aggiornato: permessi, metadata e i due servizi Android Auto presenti.")
          PY
          grep -q 'android:name=".KodiAutoCarService"' kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in
          grep -q 'android:name=".KodiAutoMediaLibraryService"' kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in

      - name: Apply original Kodi Auto launcher image
        run: |
          RES="kodi/build/tools/android/packaging/xbmc/res"

          mkdir -p "$RES/drawable-nodpi" "$RES/drawable"

          cp KodiAuto/kodiauto-icon.png \
            "$RES/drawable-nodpi/kodiauto_icon.png"

          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'EOF'
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/kodiauto_icon"
              android:gravity="fill" />
          EOF

          echo "Immagine originale Kodi Auto applicata."
          test -s "$RES/drawable-nodpi/kodiauto_icon.png"

      - name: Restore Kodi Auto logo in original Kodi home logo slot
        working-directory: kodi
        run: |
          set -e
          LOGO="../KodiAuto/kodiauto-icon.png"
          VENDOR_LOGO="media/vendor_logo.png"

          test -s "$LOGO"
          test -d "addons/skin.estuary"
          cp "$LOGO" "$VENDOR_LOGO"
          test -s "$VENDOR_LOGO"

          grep -q 'special://xbmc/media/vendor_logo.png' addons/skin.estuary/xml/Home.xml
          echo "Logo Kodi Auto copiato nel percorso originale usato da Estuary."
          echo "Home.xml lasciato intatto per mantenere il collegamento standard di Kodi."

      - name: Preserve original Kodi navigation and Matrix styling
        working-directory: kodi
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep Estuary's original menu entries, order, labels, actions and layout.
          # Only expose the existing touch back control outside the home screen.
          includes = Path("addons/skin.estuary/xml/Includes.xml")
          data = includes.read_text(encoding="utf-8")
          old = '<include condition="Skin.HasSetting(touchmode) + !Window.IsActive(home)">TouchBackButton</include>'
          new = '<include condition="!Window.IsActive(home)">TouchBackButton</include>'
          if old not in data:
              raise SystemExit("Richiamo TouchBackButton di Estuary non trovato")
          data = data.replace(old, new, 1)
          includes.write_text(data, encoding="utf-8")
          print("Navigazione originale di Kodi conservata; pulsante Indietro touch mantenuto.")
          PY

          grep -q '<include condition="!Window.IsActive(home)">TouchBackButton</include>' addons/skin.estuary/xml/Includes.xml
          grep -q 'border_alpha' addons/skin.estuary/colors/defaults.xml

      - name: Bootstrap Kodi dependencies
        working-directory: kodi/tools/depends
        run: |
          ./bootstrap

      - name: Configure Android ARM64
        working-directory: kodi/tools/depends
        run: |
          ./configure \
            --with-tarballs=$HOME/android-tools/xbmc-tarballs \
            --host=aarch64-linux-android \
            --with-sdk-path=$ANDROID_HOME \
            --prefix=$HOME/android-tools/xbmc-depends

      - name: Build Kodi dependencies
        working-directory: kodi/tools/depends
        run: |
          make -j2

      - name: Configure Kodi CMake for Release
        working-directory: kodi
        run: |
          make -C tools/depends/target/cmakebuildsys Configuration=Release

      - name: Build Kodi
        working-directory: kodi
        run: |
          cd build
          make -j2

      - name: Integrate Android Auto into the single Kodi APK
        run: |
          set -euo pipefail
          PKG_DIR="kodi/build/tools/android/packaging/xbmc"
          SRC="KodiAuto/app/src/main/java/it/kodiauto/app"

          test -f "$PKG_DIR/build.gradle"
          test -f "$PKG_DIR/AndroidManifest.xml"
          test -f "$SRC/KodiAutoMediaLibraryService.kt"
          test -f "$SRC/KodiJsonRpcClient.kt"

          # Kodi's own Gradle application module remains the only APK.
          # AGP 9.x has built-in Kotlin support; compile the integration
          # sources copied by Kodi's existing packaging Makefile.
          KOTLIN_DIR="$PKG_DIR/java/it/kodiauto/media"
          mkdir -p "$KOTLIN_DIR" "$PKG_DIR/res/xml"
          sed 's/^package it\.kodiauto\.app$/package it.kodiauto.media/' \
            "$SRC/KodiAutoMediaLibraryService.kt" > "$KOTLIN_DIR/KodiAutoMediaLibraryService.kt"
          sed 's/^package it\.kodiauto\.app$/package it.kodiauto.media/' \
            "$SRC/KodiJsonRpcClient.kt" > "$KOTLIN_DIR/KodiJsonRpcClient.kt"
          sed 's/^package it\.kodiauto\.app$/package it.kodiauto.media/' \
            "$SRC/KodiRemotePlayer.kt" > "$KOTLIN_DIR/KodiRemotePlayer.kt"
          sed 's/^package it\.kodiauto\.app;$/package it.kodiauto.media;/' \
            "$SRC/KodiAutoCarService.java" > "$KOTLIN_DIR/KodiAutoCarService.java"
          sed 's/^package it\.kodiauto\.app;$/package it.kodiauto.media;/' \
            "$SRC/KodiAutoCarActivity.java" > "$KOTLIN_DIR/KodiAutoCarActivity.java"
          mkdir -p "$PKG_DIR/libs"
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/AndreyPavlenko/Fermata/65a3c1632b5c3ded8f036c025458f7b77f780f8d/fermata/lib/auto/aauto.aar \
            -o "$PKG_DIR/libs/aauto.aar"
          test -s "$PKG_DIR/libs/aauto.aar"
          cp KodiAuto/app/src/main/res/xml/automotive_app_desc.xml \
            "$PKG_DIR/res/xml/automotive_app_desc.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re

          module = Path("kodi/build/tools/android/packaging/xbmc")
          gradle = module / "build.gradle"
          text = gradle.read_text(encoding="utf-8")

          if "dependencies {" not in text:
              raise SystemExit("Blocco dependencies non trovato nel modulo Kodi")

          dependencies = [
              "implementation files('libs/aauto.aar')",
              "implementation 'androidx.car.app:app:1.7.0'",
              "implementation 'androidx.media3:media3-session:1.8.0'",
              "implementation 'com.google.guava:guava:33.3.1-android'",
          ]
          for dependency in dependencies:
              if dependency not in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )

          # AGP 9.2 built-in Kotlin compiles .kt files from the
          # existing main Java source directory; no separate Kotlin
          # source-set DSL is needed here.
          gradle.write_text(text, encoding="utf-8")

          manifest = module / "AndroidManifest.xml"
          xml = manifest.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '    <uses-permission android:name="androidx.car.app.ACCESS_SURFACE" />',
              '    <uses-permission android:name="androidx.car.app.NAVIGATION_TEMPLATES" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />',
          ]
          for permission in permissions:
              name = re.search(r'android:name="([^"]+)"', permission).group(1)
              if name not in xml:
                  xml = xml.replace("    <application", permission + "\n\n    <application", 1)

          if 'com.google.android.gms.car.application' not in xml:
              xml, count = re.subn(
                  r'(<application\b[\s\S]*?>)',
                  r'\1\n        <meta-data android:name="com.google.android.gms.car.application" android:resource="@xml/automotive_app_desc" />',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Tag application non trovato nel manifest Kodi")

          def add_before_application_close(document, fragment):
              if document.count("</application>") != 1:
                  raise SystemExit("Chiusura application assente o non univoca nel manifest Kodi")
              head, tail = document.rsplit("</application>", 1)
              return head + fragment + "\n    </application>" + tail

          if 'android:name=".KodiAutoMediaLibraryService"' not in xml:
              media_service = '''
                  <service
                      android:name=".KodiAutoMediaLibraryService"
                      android:label="Kodi Auto"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaLibraryService" />
                          <action android:name="androidx.media3.session.MediaSessionService" />
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
              '''
              xml = add_before_application_close(xml, media_service)

          if 'android:name=".KodiAutoCarService"' not in xml:
              car_service = '''
                  <service
                      android:name=".KodiAutoCarService"
                      android:exported="true"
                      android:label="Kodi Auto">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION" />
                          <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM" />
                      </intent-filter>
                  </service>
              '''
              xml = add_before_application_close(xml, car_service)

          if 'android:name=".KodiAutoCarService"' not in xml:
              raise SystemExit("KodiAutoCarService non inserito nel manifest generato")
          if 'android:name=".KodiAutoMediaLibraryService"' not in xml:
              raise SystemExit("KodiAutoMediaLibraryService non inserito nel manifest generato")
          manifest.write_text(xml, encoding="utf-8")
          PY

          check_file() {
            if [ ! -s "$1" ]; then echo "CHECK FAILED: file mancante o vuoto: $1"; exit 1; fi
            echo "CHECK OK: $1"
          }
          check_text() {
            if ! grep -Fq "$1" "$2"; then echo "CHECK FAILED: testo '$1' assente in $2"; exit 1; fi
            echo "CHECK OK: '$1' in $2"
          }
          check_file "$PKG_DIR/java/it/kodiauto/media/KodiAutoMediaLibraryService.kt"
          check_file "$PKG_DIR/java/it/kodiauto/media/KodiJsonRpcClient.kt"
          check_file "$PKG_DIR/java/it/kodiauto/media/KodiRemotePlayer.kt"
          check_file "$PKG_DIR/java/it/kodiauto/media/KodiAutoCarService.java"
          check_file "$PKG_DIR/java/it/kodiauto/media/KodiAutoCarActivity.java"
          check_file "$PKG_DIR/libs/aauto.aar"
          check_text 'androidx.media3.session.MediaLibraryService' "$PKG_DIR/AndroidManifest.xml"
          check_text 'KodiAutoCarService' "$PKG_DIR/AndroidManifest.xml"
          check_text 'CATEGORY_PROJECTION' "$PKG_DIR/AndroidManifest.xml"
          check_text 'automotive_app_desc' "$PKG_DIR/AndroidManifest.xml"
          check_text 'media3-session:1.8.0' "$PKG_DIR/build.gradle"
          check_text 'aauto.aar' "$PKG_DIR/build.gradle"
          check_text '<uses name="projection" />' "$PKG_DIR/res/xml/automotive_app_desc.xml"
          check_file "$PKG_DIR/res/xml/automotive_app_desc.xml"
          echo "Integrazione Android Auto inserita nel modulo APK Kodi unico."

      - name: Restore persistent Kodi Auto test-signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kodiauto-test-signing-key-v1

      - name: Create test-signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Kodi Auto Test,O=Kodi Auto,C=IT"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android

      - name: Increase Gradle wrapper download timeout
        run: |
          set -e
          mapfile -t WRAPPERS < <(find kodi -type f -name gradle-wrapper.properties -print)
          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "ERROR: nessun gradle-wrapper.properties trovato"
            exit 1
          fi
          for WRAPPER in "${WRAPPERS[@]}"; do
            if grep -q '^networkTimeout=' "$WRAPPER"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$WRAPPER"
            else
              echo 'networkTimeout=180000' >> "$WRAPPER"
            fi
            echo "Configurazione Gradle aggiornata: $WRAPPER"
            grep -E '^(distributionUrl|networkTimeout)=' "$WRAPPER"
          done

      - name: Package Kodi APK
        working-directory: kodi/build
        run: |
          make apk

      - name: Verify Kodi Auto package ID
        run: |
          APK=$(find kodi -maxdepth 1 \
            -name 'kodiapp-arm64-v8a-release.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK non trovato"
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"

          if [ ! -f "$AAPT" ]; then
            echo "ERROR: aapt non trovato"
            exit 1
          fi

          echo "Verifica identificativo APK:"
          "$AAPT" dump badging "$APK" | head -n 1

          if ! "$AAPT" dump badging "$APK" | grep -Fq "name='it.kodiauto.media'"; then
            echo "ERROR: APK non ha il package ID previsto!"
            exit 1
          fi

          echo "OK: Kodi Auto ha un package ID separato!"

          echo "Verifica manifest Android Auto nell'APK finale:"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/kodiauto-manifest.txt

          echo "Elementi Android Auto rilevati nel manifest:"
          grep -E 'com.google.android.gms.car.application|KodiAutoMediaLibraryService|KodiAutoCarService|CATEGORY_PROJECTION|MediaLibraryService|MediaSessionService|MediaBrowserService' /tmp/kodiauto-manifest.txt || true

          grep -Fq 'com.google.android.gms.car.application' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: metadata Android Auto assente dal manifest finale"
            exit 1
          }
          grep -Fq 'KodiAutoMediaLibraryService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: servizio Kodi Auto assente dal manifest finale"
            exit 1
          }
          grep -Fq 'MediaLibraryService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: action MediaLibraryService assente dal manifest finale"
            exit 1
          }
          grep -Fq 'MediaBrowserService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: action MediaBrowserService assente dal manifest finale"
            exit 1
          }

          grep -Fq 'KodiAutoCarService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: servizio Projection Kodi Auto assente dal manifest finale"
            exit 1
          }
          grep -Fq 'CATEGORY_PROJECTION' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: categoria Projection assente dal manifest finale"
            exit 1
          }

          echo "OK: manifest finale contiene Media Browser e Projection service."

      - name: Upload Kodi APK
        uses: actions/upload-artifact@v4
        with:
          name: KodiAuto-Android-ARM64-Release-Test
          path: kodi/kodiapp-arm64-v8a-release.apk
          if-no-files-found: error
