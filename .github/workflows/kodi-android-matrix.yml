name: Build Kodi Android Engine

on:
  workflow_dispatch:
  push:
    branches:
      - Kodi-engine
      - fermata-integration
      - testF-48-base-carprojection-fermata
      - kodiauto-logo-fix-98
      - kodiauto-logo-97
      - kodiauto-carapi-99

jobs:
  build-kodi:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential curl flex gawk gperf git \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

      - name: Clone Kodi source
        run: |
          git clone --depth 1 \
            https://github.com/xbmc/xbmc.git kodi

      - name: Apply Kodi Auto Matrix visual theme
        working-directory: kodi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          colors = Path("addons/skin.estuary/colors/defaults.xml")
          data = colors.read_text(encoding="utf-8")
          palette = {
              "primary_background": "FF073B20",
              "secondary_background": "6600FF41",
              "dialog_tint": "FF080D0A",
              "dialog_header_tint": "FF064D27",
              "button_focus": "FF00FF41",
              "button_alt_focus": "9900FF41",
              "selected": "FF00FF41",
              "blue": "FF00E83A",
              "background": "FF000000",
          }

          for name, value in palette.items():
              pattern = rf'(<color name="{re.escape(name)}">)[^<]*(</color>)'
              data, count = re.subn(
                  pattern,
                  lambda match, v=value: match.group(1) + v + match.group(2),
                  data
              )
              if count != 1:
                  raise SystemExit(f"Colore non trovato o duplicato: {name}")

          colors.write_text(data, encoding="utf-8")
          print("Tema Kodi Auto nero e verde Matrix applicato.")
          PY

          grep -q 'FF00FF41' addons/skin.estuary/colors/defaults.xml
          grep -q 'FF000000' addons/skin.estuary/colors/defaults.xml

      - name: Set Kodi Auto app identity
        run: |
          sed -i 's/^APP_NAME .*/APP_NAME Kodi/' kodi/version.txt
          sed -i 's/^APP_PACKAGE .*/APP_PACKAGE it.kodiauto.media/' kodi/version.txt

          sed -i 's/@APP_NAME@/Kodi Auto/g' \
            kodi/tools/android/packaging/xbmc/strings.xml.in

          echo "Controllo identità:"
          grep -E '^(APP_NAME|APP_PACKAGE) ' kodi/version.txt
          grep 'app_name' kodi/tools/android/packaging/xbmc/strings.xml.in

          grep -q '^APP_NAME Kodi$' kodi/version.txt
          grep -q '^APP_PACKAGE it\.kodiauto\.media$' kodi/version.txt
          grep -q 'Kodi Auto' kodi/tools/android/packaging/xbmc/strings.xml.in

      - name: Add Android Auto declarations to Kodi manifest template
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in")
          xml = manifest.read_text(encoding="utf-8")

          if 'com.google.android.gms.car.application' not in xml:
              xml, count = re.subn(
                  r'(<application\b[^>]*>)',
                  r'\1\n<meta-data android:name="com.google.android.gms.car.application" android:resource="@xml/automotive_app_desc" />',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Impossibile inserire metadata Android Auto nel template")

          # Match Fermata Auto: declare the minimum supported Car App API level.
          if 'androidx.car.app.minCarApiLevel' not in xml:
              xml, count = re.subn(
                  r'(<application\b[^>]*>)',
                  r'\1\n<meta-data android:name="androidx.car.app.minCarApiLevel" android:value="5" />',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Impossibile inserire minCarApiLevel nel template Kodi")
          if not re.search(
              r'<meta-data[^>]+android:name="androidx\.car\.app\.minCarApiLevel"[^>]+android:value="5"',
              xml
          ):
              raise SystemExit("minCarApiLevel=5 non presente nel template Kodi")

          if 'android:name=".KodiAutoMediaLibraryService"' not in xml:
              service = """
          <service
              android:name=".KodiAutoMediaLibraryService"
              android:label="Kodi Auto"
              android:exported="true"
              android:foregroundServiceType="mediaPlayback">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaLibraryService" />
                  <action android:name="androidx.media3.session.MediaSessionService" />
                  <action android:name="android.media.browse.MediaBrowserService" />
              </intent-filter>
          </service>
          """
              if "</application>" not in xml:
                  raise SystemExit("Chiusura application non trovata nel template Kodi")
              xml = xml.replace("</application>", service + "\n</application>", 1)

          car_permissions = [
              "androidx.car.app.ACCESS_SURFACE",
              "androidx.car.app.NAVIGATION_TEMPLATES",
              "android.permission.WAKE_LOCK",
              "android.permission.DISABLE_KEYGUARD",
          ]
          for permission in car_permissions:
              if f'android:name="{permission}"' not in xml:
                  xml, count = re.subn(
                      r'(<manifest\b[^>]*>)',
                      r'\1\n    <uses-permission android:name="' + permission + '" />',
                      xml,
                      count=1
                  )
                  if count != 1:
                      raise SystemExit(f"Impossibile aggiungere permesso Car Projection: {permission}")

          if 'android:name=".KodiAutoCarService"' not in xml:
              car_service = """
          <service
              android:name=".KodiAutoCarService"
              android:exported="true"
              android:label="Kodi Auto">
              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION" />
                  <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM" />
              </intent-filter>
          </service>
          """
              if xml.count("</application>") != 1:
                  raise SystemExit("Chiusura application assente o non univoca nel template")
              xml = xml.replace("</application>", car_service + "\n</application>", 1)

          manifest.write_text(xml, encoding="utf-8")
          assert 'com.google.android.gms.car.application' in xml
          assert 'android:name=".KodiAutoMediaLibraryService"' in xml
          assert 'android:name=".KodiAutoCarService"' in xml
          assert 'androidx.media3.session.MediaLibraryService' in xml
          assert 'com.google.android.gms.car.category.CATEGORY_PROJECTION' in xml
          print("Template sorgente Kodi aggiornato: metadati e servizio Android Auto presenti.")
          PY

      - name: Restore Kodi Auto logo in original Kodi home logo slot
        working-directory: kodi
        run: |
          set -e
          LOGO="../KodiAuto/kodiauto-icon.png"
          VENDOR_LOGO="media/vendor_logo.png"

          test -s "$LOGO"
          test -d "addons/skin.estuary"
          cp "$LOGO" "$VENDOR_LOGO"
          test -s "$VENDOR_LOGO"

          grep -q 'special://xbmc/media/vendor_logo.png' addons/skin.estuary/xml/Home.xml
          echo "Logo Kodi Auto copiato nel percorso originale usato da Estuary."
          echo "Home.xml lasciato intatto per mantenere il collegamento standard di Kodi."

      - name: Personalize Kodi Auto home navigation
        working-directory: kodi
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path("addons/skin.estuary/xml/Home.xml")
          data = home.read_text(encoding="utf-8")

          # Change only the labels in the main home menu, keeping Kodi's
          # original actions, content IDs, visibility rules and TV/PVR links.
          start = data.find('<control type="fixedlist" id="9000">')
          if start < 0:
              raise SystemExit("Menu principale Estuary non trovato")
          content_start = data.find("<content>", start)
          content_end = data.find("</content>", content_start)
          if content_start < 0 or content_end < 0:
              raise SystemExit("Elenco voci menu non trovato")

          menu = data[content_start:content_end]
          labels = {
              "$LOCALIZE[342]": "FILM",
              "$LOCALIZE[20343]": "SERIE TV",
              "$LOCALIZE[2]": "MUSICA",
              "$LOCALIZE[19020]": "TV IN DIRETTA",
              "$LOCALIZE[19021]": "RADIO",
              "$LOCALIZE[3]": "VIDEO",
              "$LOCALIZE[24001]": "COMPONENTI",
              "$LOCALIZE[10134]": "PREFERITI",
          }
          for old, new in labels.items():
              if old not in menu:
                  raise SystemExit(f"Voce menu non trovata: {old}")
              menu = menu.replace(old, new, 1)

          data = data[:content_start] + menu + data[content_end:]
          home.write_text(data, encoding="utf-8")
          print("Menu principale Kodi Auto personalizzato; funzioni Kodi originali conservate.")
          PY

          grep -q '<label>TV IN DIRETTA</label>' addons/skin.estuary/xml/Home.xml
          grep -q '<label>MUSICA</label>' addons/skin.estuary/xml/Home.xml

          # Give the Kodi Auto home navigation a larger, more touch-friendly
          # layout while retaining Estuary's original focus animations/actions.
          python3 - <<'PY'
          from pathlib import Path

          home = Path("addons/skin.estuary/xml/Home.xml")
          data = home.read_text(encoding="utf-8")
          start = data.find('<control type="fixedlist" id="9000">')
          if start < 0:
              raise SystemExit("Menu Kodi Auto non trovato per il layout touch")
          # Edit only the menu and the first matching layout values after its start.
          before, menu = data[:start], data[start:]
          menu = menu.replace('<focusedlayout height="95">', '<focusedlayout height="108">', 1)
          menu = menu.replace('<itemlayout height="95">', '<itemlayout height="108">', 1)
          menu = menu.replace('<width>95</width>', '<width>108</width>', 4)
          menu = menu.replace('<height>95</height>', '<height>108</height>', 6)
          menu = menu.replace('<left>104</left>', '<left>118</left>', 2)
          if '<focusedlayout height="108">' not in menu or '<itemlayout height="108">' not in menu:
              raise SystemExit("Layout touch maggiorato non applicato")
          home.write_text(before + menu, encoding="utf-8")
          print("Menu iniziale Kodi Auto: spaziatura e icone ingrandite per il touch.")
          PY

          grep -q '<focusedlayout height="108">' addons/skin.estuary/xml/Home.xml

          # Estuary already defines a touch back control in its TopBar.
          # Make its icon visible on every screen that uses the navigation bar.
          python3 - <<'PY'
          from pathlib import Path

          includes = Path("addons/skin.estuary/xml/Includes.xml")
          data = includes.read_text(encoding="utf-8")
          old = '<include condition="Skin.HasSetting(touchmode) + !Window.IsActive(home)">TouchBackButton</include>'
          new = '<include condition="!Window.IsActive(home)">TouchBackButton</include>'
          if old not in data:
              raise SystemExit("Richiamo TouchBackButton di Estuary non trovato")
          data = data.replace(old, new, 1)
          includes.write_text(data, encoding="utf-8")
          print("Pulsante touch Indietro attivato nella barra superiore.")
          PY

          grep -q '<include condition="!Window.IsActive(home)">TouchBackButton</include>' addons/skin.estuary/xml/Includes.xml

      - name: Bootstrap Kodi dependencies
        working-directory: kodi/tools/depends
        run: |
          ./bootstrap

      - name: Configure Android ARM64
        working-directory: kodi/tools/depends
        run: |
          ./configure \
            --with-tarballs=$HOME/android-tools/xbmc-tarballs \
            --host=aarch64-linux-android \
            --with-sdk-path=$ANDROID_HOME \
            --prefix=$HOME/android-tools/xbmc-depends

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Increase Gradle wrapper download timeout
        run: |
          set -e
          mapfile -t WRAPPERS < <(find kodi -type f -name gradle-wrapper.properties -print)
          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "ERROR: nessun gradle-wrapper.properties trovato"
            exit 1
          fi
          for WRAPPER in "${WRAPPERS[@]}"; do
            if grep -q '^networkTimeout=' "$WRAPPER"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=180000/' "$WRAPPER"
            else
              echo 'networkTimeout=180000' >> "$WRAPPER"
            fi
            echo "Configurazione Gradle aggiornata: $WRAPPER"
            grep -E '^(distributionUrl|networkTimeout)=' "$WRAPPER"
          done

      - name: Build Kodi dependencies
        working-directory: kodi/tools/depends
        run: |
          make -j2

      - name: Configure Kodi CMake
        working-directory: kodi
        run: |
          make -C tools/depends/target/cmakebuildsys

      - name: Preflight and integrate Android Auto and Fermata before native Kodi build
        run: |
          set -euo pipefail
          PKG_DIR="kodi/build/tools/android/packaging/xbmc"
          SRC="KodiAuto/app/src/main/java/it/kodiauto/app"

          test -f "$PKG_DIR/build.gradle"
          test -f "$PKG_DIR/AndroidManifest.xml"
          test -f "$SRC/KodiAutoMediaLibraryService.kt"
          test -f "$SRC/KodiJsonRpcClient.kt"
          test -f "$SRC/KodiAutoCarActivity.java"
          test -f "$SRC/KodiAutoCarService.java"

          SOURCE_DIR="$PKG_DIR/src"
          mkdir -p "$SOURCE_DIR" "$PKG_DIR/res/xml" "$PKG_DIR/libs"
          sed 's/^package it\.kodiauto\.app$/package it.kodiauto.media/' \
            "$SRC/KodiAutoMediaLibraryService.kt" > "$SOURCE_DIR/KodiAutoMediaLibraryService.kt"
          sed 's/^package it\.kodiauto\.app$/package it.kodiauto.media/' \
            "$SRC/KodiJsonRpcClient.kt" > "$SOURCE_DIR/KodiJsonRpcClient.kt"
          sed 's/^package it\.kodiauto\.app;$/package it.kodiauto.media;/' \
            "$SRC/KodiAutoCarService.java" > "$SOURCE_DIR/KodiAutoCarService.java"
          sed -e 's/^package it\.kodiauto\.app;$/package it.kodiauto.media;/' \
              -e 's/^[[:space:]]*protected void onCreate(/  public void onCreate(/' \
              -e 's/^[[:space:]]*protected void onDestroy(/  public void onDestroy(/' \
            "$SRC/KodiAutoCarActivity.java" > "$SOURCE_DIR/KodiAutoCarActivity.java"
          grep -Eq '^[[:space:]]*public void onCreate\(' "$SOURCE_DIR/KodiAutoCarActivity.java"
          grep -Eq '^[[:space:]]*public void onDestroy\(' "$SOURCE_DIR/KodiAutoCarActivity.java"
          ! grep -Eq '^[[:space:]]*protected void onCreate\(' "$SOURCE_DIR/KodiAutoCarActivity.java"
          ! grep -Eq '^[[:space:]]*protected void onDestroy\(' "$SOURCE_DIR/KodiAutoCarActivity.java"

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/AndreyPavlenko/Fermata/65a3c1632b5c3ded8f036c025458f7b77f780f8d/fermata/lib/auto/aauto.aar \
            -o "$PKG_DIR/libs/aauto.aar"
          test -s "$PKG_DIR/libs/aauto.aar"
          cp KodiAuto/app/src/main/res/xml/automotive_app_desc.xml \
            "$PKG_DIR/res/xml/automotive_app_desc.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re

          module = Path("kodi/build/tools/android/packaging/xbmc")
          gradle = module / "build.gradle"
          text = gradle.read_text(encoding="utf-8")
          if "dependencies {" not in text:
              raise SystemExit("Blocco dependencies non trovato nel modulo Kodi")

          dependencies = [
              "implementation files('libs/aauto.aar')",
              "implementation 'androidx.car.app:app:1.7.0'",
              "implementation 'androidx.media3:media3-session:1.8.0'",
              "implementation 'androidx.media3:media3-exoplayer:1.8.0'",
              "implementation 'com.google.guava:guava:33.3.1-android'",
          ]
          for dependency in dependencies:
              if dependency not in text:
                  text = text.replace("dependencies {", "dependencies {\n    " + dependency, 1)
          # Kodi's packaging Makefile deletes xbmc/java during apk-clean and
          # recreates it from xbmc/src. Register that same source root for Kotlin.
          source_marker = "java.srcDirs = ['java']"
          if source_marker not in text:
              raise SystemExit("Source set Java Kodi non trovato")
          if "kotlin.srcDirs = ['java']" not in text:
              text = text.replace(source_marker, source_marker + "\nkotlin.srcDirs = ['java']", 1)
          gradle.write_text(text, encoding="utf-8")

          manifest = module / "AndroidManifest.xml"
          xml = manifest.read_text(encoding="utf-8")
          permissions = [
              "android.permission.INTERNET",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "androidx.car.app.ACCESS_SURFACE",
              "androidx.car.app.NAVIGATION_TEMPLATES",
              "android.permission.WAKE_LOCK",
              "android.permission.DISABLE_KEYGUARD",
          ]
          for permission in permissions:
              if f'android:name="{permission}"' not in xml:
                  xml = xml.replace(
                      "    <application",
                      f'    <uses-permission android:name="{permission}" />\n\n    <application',
                      1
                  )

          if 'com.google.android.gms.car.application' not in xml:
              xml, count = re.subn(
                  r'(<application\b[\s\S]*?>)',
                  r'\1\n        <meta-data android:name="com.google.android.gms.car.application" android:resource="@xml/automotive_app_desc" />',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Metadata Android Auto non inserito")

          if 'androidx.car.app.minCarApiLevel' not in xml:
              xml, count = re.subn(
                  r'(<application\b[\s\S]*?>)',
                  r'\1\n        <meta-data android:name="androidx.car.app.minCarApiLevel" android:value="5" />',
                  xml,
                  count=1
              )
              if count != 1:
                  raise SystemExit("minCarApiLevel non inserito nel manifest generato")
          if not re.search(
              r'<meta-data[^>]+android:name="androidx\.car\.app\.minCarApiLevel"[^>]+android:value="5"',
              xml
          ):
              raise SystemExit("Manifest generato senza minCarApiLevel=5")

          if 'android:name=".KodiAutoMediaLibraryService"' not in xml:
              media_service = '''
                  <service
                      android:name=".KodiAutoMediaLibraryService"
                      android:label="Kodi Auto"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaLibraryService" />
                          <action android:name="androidx.media3.session.MediaSessionService" />
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
              '''
              xml = xml.replace("    </application>", media_service + "\n    </application>", 1)

          if 'android:name=".KodiAutoCarService"' not in xml:
              car_service = '''
                  <service
                      android:name=".KodiAutoCarService"
                      android:exported="true"
                      android:label="Kodi Auto">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION" />
                          <category android:name="com.google.android.gms.car.category.CATEGORY_PROJECTION_OEM" />
                      </intent-filter>
                  </service>
              '''
              if xml.count("</application>") != 1:
                  raise SystemExit("Chiusura application assente o non univoca")
              xml = xml.replace("</application>", car_service + "\n    </application>", 1)

          manifest.write_text(xml, encoding="utf-8")
          PY

          for file in \
            "$SOURCE_DIR/KodiAutoMediaLibraryService.kt" \
            "$SOURCE_DIR/KodiJsonRpcClient.kt" \
            "$SOURCE_DIR/KodiAutoCarActivity.java" \
            "$SOURCE_DIR/KodiAutoCarService.java" \
            "$PKG_DIR/libs/aauto.aar" \
            "$PKG_DIR/res/xml/automotive_app_desc.xml"; do
            test -s "$file" || { echo "ERRORE: file mancante $file"; exit 1; }
            echo "CHECK OK: $file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          module = Path("kodi/build/tools/android/packaging/xbmc")
          manifest = (module / "AndroidManifest.xml").read_text(encoding="utf-8")
          gradle = (module / "build.gradle").read_text(encoding="utf-8")
          desc = (module / "res/xml/automotive_app_desc.xml").read_text(encoding="utf-8")

          checks = {
              "MediaLibraryService manifest": "MediaLibraryService" in manifest,
              "MediaSessionService manifest": "MediaSessionService" in manifest,
              "MediaBrowserService manifest": "MediaBrowserService" in manifest,
              "KodiAutoCarService manifest": "KodiAutoCarService" in manifest,
              "Car Projection category": "CATEGORY_PROJECTION" in manifest,
              "Car App minimum API metadata": bool(re.search(
                  r'androidx\.car\.app\.minCarApiLevel.{0,160}android:value="5"',
                  manifest
              )),
              "Fermata AAR dependency": "aauto.aar" in gradle,
              "Car App dependency": "androidx.car.app:app:1.7.0" in gradle,
              "projection app descriptor": bool(re.search(
                  r"""<uses\s+name=["']projection["']\s*/?>""", desc
              )),
          }

          for label, ok in checks.items():
              print(("PREFLIGHT OK: " if ok else "PREFLIGHT MISSING: ") + label)

          missing = [label for label, ok in checks.items() if not ok]
          if missing:
              print("Manifest (righe Android Auto):")
              for number, line in enumerate(manifest.splitlines(), 1):
                  if re.search(r'Media|KodiAuto|CATEGORY_PROJECTION|car.application', line):
                      print(f"{number}: {line.strip()}")
              print("Gradle (dipendenze):")
              for number, line in enumerate(gradle.splitlines(), 1):
                  if re.search(r'aauto|car.app|media3|guava', line):
                      print(f"{number}: {line.strip()}")
              raise SystemExit("Preflight non superato: " + ", ".join(missing))

          print("PREFLIGHT COMPLETATO: integrazione Android Auto/Fermata verificata.")
          PY


      - name: Apply original Kodi Auto launcher image
        run: |
          set -euo pipefail
          RES="kodi/build/tools/android/packaging/xbmc/res"
          LOGO="KodiAuto/kodiauto-icon.png"

          test -s "$LOGO"
          mkdir -p "$RES/drawable-nodpi" "$RES/drawable" \
            "$RES/mipmap-nodpi" "$RES/mipmap-anydpi-v26"

          # Keep the source image and make it the actual manifest launcher resource.
          cp "$LOGO" "$RES/drawable-nodpi/kodiauto_icon.png"
          cp "$LOGO" "$RES/mipmap-nodpi/ic_launcher.png"

          cat > "$RES/drawable/ic_launcher_foreground.xml" <<'EOF'
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/kodiauto_icon"
              android:gravity="fill" />
          EOF

          # Android 8+ uses the adaptive icon; older Android versions use
          # mipmap-nodpi/ic_launcher.png. The manifest already points to @mipmap/ic_launcher.
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          test -s "$RES/drawable-nodpi/kodiauto_icon.png"
          test -s "$RES/mipmap-nodpi/ic_launcher.png"
          grep -q '@drawable/ic_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'android:icon="@mipmap/ic_launcher"' kodi/tools/android/packaging/xbmc/AndroidManifest.xml.in
          echo "Logo Kodi Auto collegato alla vera risorsa launcher @mipmap/ic_launcher."


      - name: Build Kodi
        working-directory: kodi
        run: |
          cd build
          make -j2

      - name: Package Kodi APK
        working-directory: kodi/build
        run: |
          make apk

      - name: Verify Kodi Auto package ID
        run: |
          APK=$(find kodi -maxdepth 1 \
            -name 'kodiapp-arm64-v8a-debug.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK non trovato"
            exit 1
          fi

          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"

          if [ ! -f "$AAPT" ]; then
            echo "ERROR: aapt non trovato"
            exit 1
          fi

          echo "Verifica identificativo APK:"
          "$AAPT" dump badging "$APK" | head -n 1

          if ! "$AAPT" dump badging "$APK" | grep -Fq "name='it.kodiauto.media'"; then
            echo "ERROR: APK non ha il package ID previsto!"
            exit 1
          fi

          echo "OK: Kodi Auto ha un package ID separato!"

          echo "Verifica manifest Android Auto nell'APK finale:"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/kodiauto-manifest.txt

          echo "Elementi Android Auto rilevati nel manifest:"
          grep -E 'com.google.android.gms.car.application|KodiAutoMediaLibraryService|MediaLibraryService|MediaSessionService|MediaBrowserService' /tmp/kodiauto-manifest.txt || true

          grep -Fq 'androidx.car.app.minCarApiLevel' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: metadata androidx.car.app.minCarApiLevel assente dal manifest finale"
            exit 1
          }
          grep -Fq 'android:value(0x01010024)=0x00000005' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: valore minCarApiLevel=5 assente dal manifest finale"
            exit 1
          }
          grep -Fq 'com.google.android.gms.car.application' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: metadata Android Auto assente dal manifest finale"
            exit 1
          }
          grep -Fq 'KodiAutoMediaLibraryService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: servizio Kodi Auto assente dal manifest finale"
            exit 1
          }
          grep -Fq 'MediaLibraryService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: action MediaLibraryService assente dal manifest finale"
            exit 1
          }
          grep -Fq 'MediaBrowserService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: action MediaBrowserService assente dal manifest finale"
            exit 1
          }
          grep -Fq 'MediaSessionService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: action MediaSessionService assente dal manifest finale"
            exit 1
          }
          grep -Fq 'KodiAutoCarService' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: servizio Car Projection assente dal manifest finale"
            exit 1
          }
          grep -Fq 'CATEGORY_PROJECTION' /tmp/kodiauto-manifest.txt || {
            echo "ERRORE: categoria Car Projection assente dal manifest finale"
            exit 1
          }

          echo "Verifica classi Car Projection compilate nei DEX:"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/kodiauto-dex-strings.txt
          grep -Fq 'it/kodiauto/media/KodiAutoMediaLibraryService' /tmp/kodiauto-dex-strings.txt || {
            echo "ERRORE: KodiAutoMediaLibraryService non compilata nei DEX"
            exit 1
          }
          grep -Fq 'it/kodiauto/media/KodiAutoCarActivity' /tmp/kodiauto-dex-strings.txt || {
            echo "ERRORE: KodiAutoCarActivity non compilata nei DEX"
            exit 1
          }
          grep -Fq 'it/kodiauto/media/KodiAutoCarService' /tmp/kodiauto-dex-strings.txt || {
            echo "ERRORE: KodiAutoCarService non compilata nei DEX"
            exit 1
          }

          echo "OK: manifest finale contiene metadati Android Auto e servizio media esportato."

      - name: Upload Kodi APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Android-ARM64
          path: kodi/kodiapp-arm64-v8a-debug.apk
          if-no-files-found: error
